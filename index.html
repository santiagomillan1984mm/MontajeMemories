<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5B4A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E5B4A'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23F3EAD7'/%3E%3Cg fill='%23D2AF66'%3E%3Ccircle cx='32' cy='12' r='4'/%3E%3Ccircle cx='32' cy='52' r='4'/%3E%3Ccircle cx='12' cy='32' r='4'/%3E%3Ccircle cx='52' cy='32' r='4'/%3E%3Ccircle cx='18' cy='18' r='4'/%3E%3Ccircle cx='46' cy='46' r='4'/%3E%3Ccircle cx='46' cy='18' r='4'/%3E%3Ccircle cx='18' cy='46' r='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E5B4A'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23F3EAD7'/%3E%3Cg fill='%23D2AF66'%3E%3Ccircle cx='32' cy='12' r='4'/%3E%3Ccircle cx='32' cy='52' r='4'/%3E%3Ccircle cx='12' cy='32' r='4'/%3E%3Ccircle cx='52' cy='32' r='4'/%3E%3Ccircle cx='18' cy='18' r='4'/%3E%3Ccircle cx='46' cy='46' r='4'/%3E%3Ccircle cx='46' cy='18' r='4'/%3E%3Ccircle cx='18' cy='46' r='4'/%3E%3C/g%3E%3C/svg%3E">
<title>Montaje Nupcial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: herramienta de trabajo — lienzo del salón a la izquierda, panel de pestañas a la derecha (abajo en teléfono) */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F5F7F3; --ink:#1E2A24; --muted:#5D6A62; --line:#D3DBD1;
  --accent:#2E5B4A; --accent-ink:#FFFFFF; --accent-soft:#DCE8E1; --gold:#A9843F; --stage:#E1E6DF; --danger:#A13A3A;
  --font-display:'Marcellus', 'Cormorant Garamond', Georgia, serif;
  --font-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121815; --surface:#19211D; --surface-2:#1F2924; --ink:#E6ECE8; --muted:#9BA9A0; --line:#2F3C35;
  --accent:#8CC4AA; --accent-ink:#0E1A14; --accent-soft:#25372E; --gold:#D4B477; --stage:#0E1311; --danger:#E58989; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121815; --surface:#19211D; --surface-2:#1F2924; --ink:#E6ECE8; --muted:#9BA9A0; --line:#2F3C35;
  --accent:#8CC4AA; --accent-ink:#0E1A14; --accent-soft:#25372E; --gold:#D4B477; --stage:#0E1311; --danger:#E58989; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.brand small{font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.pname{flex:1 1 180px;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:600;font-size:15px}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--surface-2)}
.bar .grp{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.icon{padding:7px 9px}
.btn svg{width:16px;height:16px;flex:none}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 352px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--stage)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.floaty{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.floaty .btn{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);justify-content:center;min-width:38px}
.floaty .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px);font-size:13px}
.hint input{width:80px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--surface-2)}

.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:11px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{flex:1;overflow:auto;padding-block:14px 24px;padding-inline:16px}
.tabbody section+section{margin-top:20px}
h3{font-family:var(--font-display);font-weight:400;font-size:18px;margin:0 0 10px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:6px 0 0}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cat{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:1.2;text-align:center;min-width:0}
.cat:hover{border-color:var(--accent);background:var(--accent-soft)}
.cat canvas{width:56px;height:56px}

.field{display:grid;gap:5px;margin-bottom:12px}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:18px}
.stepper input{border:0;border-radius:0;width:56px;text-align:center;background:var(--surface);font-variant-numeric:tabular-nums}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:2px}
.sw .none{background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--line) 4px 6px)}
.sw .cust{position:relative;width:26px;height:26px;border-radius:50%;background:conic-gradient(#e44,#ec4,#4c6,#4ae,#a4e,#e44);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;text-shadow:0 0 2px rgba(0,0,0,.6);cursor:pointer;border:1px solid rgba(0,0,0,.18)}
.sw .cust[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:2px}
.sw .cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}
details{border-bottom:1px solid var(--line)}
details summary{list-style:none;cursor:pointer;padding-block:12px;font-family:var(--font-display);font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-family:var(--font-body);color:var(--muted);font-size:20px;line-height:1}
details[open] summary::after{content:'−'}
.secb{padding-bottom:16px}
.swname{font-size:12px;color:var(--muted);font-weight:500}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

table.inv{width:100%;border-collapse:collapse;font-size:13px}
table.inv td,table.inv th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.inv th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.inv td.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.cap div{background:var(--surface-2);border-radius:10px;padding:10px}
.cap b{display:block;font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.cap span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}

.plist{display:grid;gap:8px}
.pitem{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.pitem .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pitem .d{font-size:12px;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:14px;padding:20px;width:min(460px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.opt b{display:block}
.preview{margin-top:12px;border:1px solid var(--line);border-radius:10px;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.25)}

@media (max-width:820px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(260px,1fr) minmax(0,44%)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .brand small{display:none}
  .bar .lbltxt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">Montaje<small>planos de boda</small></div>
    <input id="pname" class="pname" type="text" aria-label="Nombre del proyecto">
    <div class="grp">
      <button class="btn icon" id="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn icon" id="redo" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lbltxt">Exportar</span></button>
    </div>
  </header>

  <main class="work">
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="Plano del salón"></canvas>
      <div class="hint" id="hint" hidden></div>
      <div class="floaty">
        <button class="btn" id="zin" title="Acercar" aria-label="Acercar">+</button>
        <button class="btn" id="zout" title="Alejar" aria-label="Alejar">−</button>
        <button class="btn" id="zfit" title="Ver todo" aria-label="Ver todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="btn" id="measure" title="Medir distancia" aria-label="Medir distancia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg></button>
      </div>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="add" aria-selected="true">Agregar</button>
        <button role="tab" data-tab="edit" aria-selected="false">Editar</button>
        <button role="tab" data-tab="venue" aria-selected="false">Salón</button>
        <button role="tab" data-tab="inv" aria-selected="false">Inventario</button>
        <button role="tab" data-tab="proj" aria-selected="false">Proyectos</button>
      </nav>
      <div class="tabbody" id="tab-add"></div>
      <div class="tabbody" id="tab-edit" hidden></div>
      <div class="tabbody" id="tab-venue" hidden></div>
      <div class="tabbody" id="tab-inv" hidden></div>
      <div class="tabbody" id="tab-proj" hidden></div>
    </aside>
  </main>
</div>

<div class="modal" id="exportModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exT">
    <h2 id="exT">Exportar plano</h2>
    <p class="note">El PDF lleva el plano con escala gráfica, el inventario para proveedores y la lista de mesas con invitados.</p>
    <div class="field" style="margin-top:12px"><label for="exPaper">Tamaño de hoja (PDF)</label>
      <select id="exPaper"><option value="letter">Carta</option><option value="legal">Oficio</option><option value="a4">A4</option><option value="tabloid">Doble carta (tabloide)</option></select></div>
    <label class="check"><input type="checkbox" id="exGrid"> Incluir cuadrícula de 1 m</label>
    <label class="check" style="margin-top:6px"><input type="checkbox" id="exGuests" checked> Incluir nombres de invitados por mesa</label>
    <div class="actions" style="margin-top:16px">
      <button class="btn primary" id="exPdf">Descargar PDF</button>
      <button class="btn" id="exPng">Imagen PNG</button>
      <button class="btn" id="exCsv">Inventario CSV</button>
      <button class="btn" id="exClose">Cerrar</button>
    </div>
    <p class="note" id="exMsg"></p>
    <div class="preview" id="exPrev" hidden></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m2=cm=>(cm/100).toFixed(2);

/* ---------- Catálogos ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const LINENS=[['Blanco','#FBFAF7'],['Blanco óptico','#FFFFFF'],['Marfil','#F3EAD7'],['Arena','#E2D3B8'],['Champagne','#E5D1AD'],['Dorado','#D2AF66'],['Oro rosa','#E2B8A6'],['Plata','#C8CCD1'],['Bronce','#A97A4A'],['Rosa palo','#EBC8C3'],['Blush','#F4DCD6'],['Rosa','#E8A2B4'],['Rosa mexicano','#E4157F'],['Fucsia','#C2185B'],['Coral','#F08A75'],['Durazno','#F1C6A6'],['Naranja','#E67E30'],['Terracota','#C06F4E'],['Mostaza','#D2A23A'],['Amarillo','#F3D46B'],['Rojo','#B3202E'],['Vino','#6C2433'],['Lavanda','#D7CBEA'],['Lila','#C8B7D7'],['Morado','#5E3A7A'],['Salvia','#B4C2A6'],['Verde menta','#BFE3D0'],['Verde olivo','#6E7949'],['Esmeralda','#1F5A47'],['Verde bosque','#2F4A35'],['Turquesa','#3FB5B0'],['Azul polvo','#A8BBCF'],['Azul rey','#2747A0'],['Azul marino','#22324F'],['Topo','#8E8075'],['Café','#5B4130'],['Gris perla','#D9DADB'],['Gris oxford','#4A4D52'],['Negro','#1E1E1E']];
const colorHex=n=>n&&n[0]==='#'?n:((LINENS.find(l=>l[0]===n)||LINENS[0])[1]);
const linenHex=colorHex;
const colorName=n=>!n?'Ninguno':n[0]==='#'?'Personalizado '+n.toUpperCase():n;
const nm=(list,v)=>{const f=list.find(x=>x[0]===v);return f?f[1]:String(v||'')};
const FABRICS=[['liso','Liso (poliéster)'],['lino','Lino'],['satin','Satín'],['terciopelo','Terciopelo'],['encaje','Encaje'],['lentejuela','Lentejuela'],['pintuck','Pintuck (alforzas)'],['crinkle','Tafeta arrugada (crinkle)'],['damasco','Damasco / jacquard'],['gasa','Gasa / chiffon'],['yute','Yute / arpillera'],['rayas','Rayas'],['cuadros','Cuadros (gingham)'],['floral','Estampado floral'],['ninguno','Sin mantel (se ve la mesa)']];
const SURFACES=[['parota','Parota'],['nogal','Nogal'],['roble','Roble'],['encino','Encino'],['pino','Pino rústico'],['tablones','Tablones reciclados'],['blanqueada','Madera blanqueada'],['negra','Madera negra'],['marmol','Mármol blanco'],['marmolnegro','Mármol negro'],['cristal','Cristal'],['espejo','Espejo'],['pintada','Pintada (color libre)']];
const DROPS=[['piso','Al piso'],['corta','Caída corta (30 cm)']];
const OVERLAYS=[['','Sin sobremantel'],['encaje','Encaje'],['gasa','Gasa / organza'],['lentejuela','Lentejuela'],['yute','Yute'],['satin','Satín'],['terciopelo','Terciopelo'],['damasco','Damasco']];
const RUNNERS=[['','Sin camino'],['tela','Tela lisa'],['lino','Lino'],['gasa','Gasa (caída suelta)'],['terciopelo','Terciopelo'],['encaje','Encaje'],['yute','Yute'],['lentejuela','Lentejuela'],['follaje','Guirnalda de follaje']];
const CHAIRS=[['tiffany','Tiffany / Chiavari'],['crossback','Crossback'],['thonet','Thonet'],['versalles','Versalles'],['napoleon','Napoleón'],['phoenix','Phoenix'],['ghost','Ghost (acrílico)'],['luisxv','Luis XV'],['ratan','Ratán'],['acapulco','Acapulco'],['equipal','Equipal'],['plegable','Plegable'],['banco','Banco / banca']];
const chairName=k=>nm(CHAIRS,k);
const CHAIRCOL=[['Dorado','#C9A44C'],['Plata','#B8BEC5'],['Oro rosa','#D9A893'],['Blanco','#F3F1EC'],['Natural','#B88B5B'],['Nogal','#6E4A30'],['Chocolate','#5B3A27'],['Negro','#2A2A2A'],['Transparente','rgba(190,214,232,.55)'],['Gris','#9A9DA1'],['Verde','#5F7A5A'],['Rosa','#E8A2B4']];

function seatsOf(it){
  const d=DEFS[it.t],out=[];const n=it.seats|0; if(!n) return out;
  if(d.kind==='round'){const R=it.w/2+OFF;for(let i=0;i<n;i++){const th=-Math.PI/2+i*2*Math.PI/n;out.push({x:R*Math.cos(th),y:R*Math.sin(th),a:th-Math.PI/2})}}
  else if(d.kind==='oval'){const A=it.w/2+OFF,B=it.h/2+OFF;for(let i=0;i<n;i++){const t=-Math.PI/2+i*2*Math.PI/n;const th=Math.atan2(Math.sin(t)/B,Math.cos(t)/A);out.push({x:A*Math.cos(t),y:B*Math.sin(t),a:th-Math.PI/2})}}
  else if(d.kind==='rect'){
    let rest=n;const W=it.w,H=it.h;
    if(it.ends&&n>=2&&!it.oneSide){out.push({x:-W/2-OFF,y:0,a:Math.PI/2});out.push({x:W/2+OFF,y:0,a:-Math.PI/2});rest-=2}
    const top=it.oneSide?rest:Math.ceil(rest/2),bot=it.oneSide?0:rest-top;
    for(let i=0;i<top;i++)out.push({x:-W/2+(i+.5)*W/top,y:-H/2-OFF,a:Math.PI});
    for(let i=0;i<bot;i++)out.push({x:-W/2+(i+.5)*W/bot,y:H/2+OFF,a:0});
  }
  else if(d.kind==='square'){const c=[0,0,0,0];for(let i=0;i<n;i++)c[i%4]++;const S=it.w;
    const side=(k,cnt)=>{for(let i=0;i<cnt;i++){const p=-S/2+(i+.5)*S/cnt;
      if(k===0)out.push({x:p,y:-S/2-OFF,a:Math.PI});if(k===1)out.push({x:S/2+OFF,y:p,a:-Math.PI/2});
      if(k===2)out.push({x:p,y:S/2+OFF,a:0});if(k===3)out.push({x:-S/2-OFF,y:p,a:Math.PI/2});}};
    c.forEach((cnt,k)=>side(k,cnt));}
  else if(d.kind==='serp'){
    const C={x:0,y:it.rad},ang=it.ang*Math.PI/180,Ro=it.rad+it.h/2+OFF,Ri=it.rad-it.h/2-OFF;
    const both=it.sides==='ambos';const no=both?Math.ceil(n*.6):n,ni=both?n-no:0;
    for(let i=0;i<no;i++){const f=-Math.PI/2-ang/2+(i+.5)*ang/no;out.push({x:C.x+Ro*Math.cos(f),y:C.y+Ro*Math.sin(f),a:f-Math.PI/2})}
    for(let i=0;i<ni;i++){const f=-Math.PI/2-ang/2+(i+.5)*ang/ni;out.push({x:C.x+Ri*Math.cos(f),y:C.y+Ri*Math.sin(f),a:f+Math.PI/2})}
  }
  return out;
}
function bounds(it){ // caja local {x0,y0,x1,y1}
  const d=DEFS[it.t];const m=it.seats?OFF+CH/2:0;
  if(d.kind==='round'||d.kind==='oval'||d.kind==='square'||d.kind==='rect'){
    const hw=it.w/2+(d.kind==='rect'?(it.ends&&!it.oneSide&&it.seats?m:0):m),hh=(d.kind==='square'||d.kind==='round'?it.w:it.h)/2+m;
    const HW=d.kind==='round'?it.w/2+m:hw;return {x0:-HW,y0:-hh,x1:HW,y1:hh};
  }
  if(d.kind==='serp'){const ang=it.ang*Math.PI/180,Ro=it.rad+it.h/2+m,Ri=Math.max(0,it.rad-it.h/2-(it.sides==='ambos'?m:0));let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(let k=0;k<=24;k++){const f=-Math.PI/2-ang/2+k*ang/24;for(const r of [Ro,Ri]){const x=r*Math.cos(f),y=it.rad+r*Math.sin(f);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}}
    return {x0,y0,x1,y1};}
  if(d.kind==='chair')return {x0:-24,y0:-24,x1:24,y1:24};
  return {x0:-it.w/2,y0:-it.h/2,x1:it.w/2,y1:it.h/2};
}
function toLocal(it,wx,wy){const a=-it.r*Math.PI/180,dx=wx-it.x,dy=wy-it.y;return {x:dx*Math.cos(a)-dy*Math.sin(a),y:dx*Math.sin(a)+dy*Math.cos(a)}}
function toWorldPt(it,lx,ly){const a=it.r*Math.PI/180;return {x:it.x+lx*Math.cos(a)-ly*Math.sin(a),y:it.y+lx*Math.sin(a)+ly*Math.cos(a)}}
function worldBox(it){const b=bounds(it);const pts=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].map(p=>toWorldPt(it,p[0],p[1]));
  return {x0:Math.min(...pts.map(p=>p.x)),y0:Math.min(...pts.map(p=>p.y)),x1:Math.max(...pts.map(p=>p.x)),y1:Math.max(...pts.map(p=>p.y))}}

function hit(wx,wy){const arr=sorted();for(let i=arr.length-1;i>=0;i--){const it=arr[i],p=toLocal(it,wx,wy),d=DEFS[it.t];

function shade(hex,amt){if(hex.startsWith('rgba'))return hex;let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select';
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(typing)return;
  if(e.key==='Escape'){if(mode)setMode(null);else select(null)}
  const s=P.items.find(i=>i.id===sel);if(!s)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSel()}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel()}
  else if(e.key.toLowerCase()==='r'){s.r=(s.r+(e.shiftKey?-15:15)+360)%360;commit();renderEdit()}
  else if(e.key.startsWith('Arrow')){e.preventDefault();const st=e.shiftKey?50:5;if(e.key==='ArrowLeft')s.x-=st;if(e.key==='ArrowRight')s.x+=st;if(e.key==='ArrowUp')s.y-=st;if(e.key==='ArrowDown')s.y+=st;commit()}
});

function setMode(m){mode=m;mpts=[];$('#measure').classList.toggle('on',m==='measure');updateHint();dirty=true}
function updateHint(){const h=$('#hint');
  if(mode==='measure'){h.hidden=false;h.innerHTML=mpts.length<2?'<span>Toca dos puntos para medir la distancia.</span><button class="btn sm" id="hx">Listo</button>':'<span>Toca otra vez para medir de nuevo.</span><button class="btn sm" id="hx">Listo</button>'}
  else if(mode==='calib'){h.hidden=false;
    if(mpts.length<2)h.innerHTML='<span>Toca los dos extremos de una medida que conozcas del plano (por ejemplo, un muro).</span><button class="btn sm" id="hx">Cancelar</button>';
    else h.innerHTML='<label for="calv">Distancia real</label><input id="calv" type="number" step="0.01" min="0.1" placeholder="m"><span>m</span><button class="btn sm primary" id="calok">Aplicar escala</button><button class="btn sm" id="hx">Cancelar</button>'}
  else h.hidden=true;
  const hx=$('#hx');if(hx)hx.onclick=()=>setMode(null);
  const ok=$('#calok');if(ok){$('#calv').focus();ok.onclick=()=>{const m=parseFloat($('#calv').value);if(!(m>0)){toast('Escribe la distancia en metros.');return}
    const d=Math.hypot(mpts[1].x-mpts[0].x,mpts[1].y-mpts[0].y);if(d<1)return;P.venue.cmPerPx*=(m*100)/d;setMode(null);commit();fit();renderVenue();toast('Escala ajustada. Mide algo conocido para comprobar.')}}
}

/* ---------- Historial y guardado ---------- */
function snapshot(){return JSON.stringify({items:P.items,venue:{...P.venue},settings:P.settings,event:P.event})}
function commit(){const s=snapshot();if(hist[hpos]===s)return;hist=hist.slice(0,hpos+1);hist.push(s);if(hist.length>80)hist.shift();hpos=hist.length-1;dirty=true;syncUndo();save();if(!$('#tab-inv').hidden)renderInv()}
function restore(s){const o=JSON.parse(s);P.items=o.items;Object.assign(P.venue,o.venue);P.settings=o.settings;P.event=o.event;if(!P.items.find(i=>i.id===sel))sel=null;dirty=true;renderEdit();renderVenue();renderInv();save()}
function undo(){if(hpos>0){hpos--;restore(hist[hpos]);syncUndo()}}
function redo(){if(hpos<hist.length-1){hpos++;restore(hist[hpos]);syncUndo()}}
function syncUndo(){$('#undo').disabled=hpos<=0;$('#redo').disabled=hpos>=hist.length-1}
$('#undo').onclick=undo;$('#redo').onclick=redo;

const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let saveT=null,warned=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{P.updated=Date.now();const ok=LS.set('montaje.p.'+P.id,JSON.stringify(P));
  const idx=index();const e=idx.list.find(x=>x.id===P.id);if(e){e.name=P.name;e.updated=P.updated}else idx.list.unshift({id:P.id,name:P.name,updated:P.updated});idx.current=P.id;LS.set('montaje.index',JSON.stringify(idx));
  if(!ok&&!warned){warned=true;toast('Este navegador no pudo guardar el proyecto (el plano puede ser muy pesado). Usa Proyectos › Guardar archivo.')}
  if(!$('#tab-proj').hidden)renderProj()},500)}
function index(){try{return JSON.parse(LS.get('montaje.index'))||{current:null,list:[]}}catch(e){return {current:null,list:[]}}}
function loadProject(p){P=p;P.defaults=(P.defaults&&P.defaults.place)?Object.assign(defaults(),P.defaults):defaults();(P.items||[]).forEach(migrate);P.settings=Object.assign({grid:true,snap:true},P.settings||{});sel=null;
  if(P.venue.img)ensureImg(P.venue.img);hist=[snapshot()];hpos=0;syncUndo();$('#pname').value=P.name;renderAll();requestAnimationFrame(fit)}
function ensureImg(src){if(imgCache[src])return;const im=new Image();im.onload=()=>{dirty=true};im.src=src;imgCache[src]=im}
$('#pname').addEventListener('input',e=>{P.name=e.target.value;save()});

  const add=(k,x,y,o,pr)=>{const it=makeItem(k,x,y,o);if(pr)applyPreset(it,pr);p.items.push(it);return it};p.defaults=Object.assign(defaults(),presetStyle('romantico'));
  add('pista',1500,950,{w:700,h:600});

  add('pastel',2000,420,{w:90,h:90});
  add('postres',1000,330,{w:300,h:75});
  add('photobooth',330,1700,{w:260,h:260});
  add('lounge',2660,1740,{});
  add('entrada',1500,1990,{w:220,h:40});

/* ---------- Pestañas ---------- */
function showTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['add','edit','venue','inv','proj'].forEach(k=>$('#tab-'+k).hidden=k!==t);
  if(t==='inv')renderInv();if(t==='proj')renderProj();if(t==='edit')renderEdit();if(t==='venue')renderVenue()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function select(id){sel=id;dirty=true;renderEdit();if(id&&window.innerWidth>820)showTab('edit')}

/* Agregar */
function thumb(key){const c=document.createElement('canvas');const r=2;c.width=56*r;c.height=56*r;const x=c.getContext('2d');
  const it=makeItem(key,0,0);const b=bounds(it);const s=Math.min(48/(b.x1-b.x0),48/(b.y1-b.y0),key==='columna'||key==='bocina'?.6:2);
  x.setTransform(s*r,0,0,s*r,28*r-(b.x0+b.x1)/2*s*r,28*r-(b.y0+b.y1)/2*s*r);drawItem(x,it,s,{export:true});return c}
function renderAdd(){
  const el=$('#tab-add');let h=`<section><p class="eyebrow">Toca un elemento para colocarlo en el centro de la vista</p></section>`;
  for(const [ck,cn] of CATS){h+=`<section><h3>${cn}</h3><div class="catgrid" data-cat="${ck}"></div></section>`}
  h+=`<section><h3>Varias mesas a la vez</h3>
  <div class="two"><div class="field"><label for="gT">Tipo</label><select id="gT">${['redonda','rectangular','cuadrada','imperial','ovalada','periquera'].map(k=>`<option value="${k}">${DEFS[k].name}</option>`).join('')}</select></div>
  <div class="field"><label for="gN">Cantidad</label><input id="gN" type="number" min="1" max="200" value="10"></div>
  <div class="field"><label for="gC">Columnas</label><input id="gC" type="number" min="1" max="30" value="5"></div>
  <div class="field"><label for="gS">Pasillo entre mesas (m)</label><input id="gS" type="number" min="0" step="0.1" value="1.5"></div></div>
  <button class="btn primary" id="gGo">Colocar mesas</button><p class="note">Se numeran solas y usan el último estilo de mantel y silla que elegiste. Se recomienda dejar al menos 1.5 m entre respaldos para que pasen meseros.</p></section>`;
  el.innerHTML=h;
  for(const [k,d] of Object.entries(DEFS)){const g=el.querySelector(`[data-cat="${d.cat}"]`);const b=document.createElement('button');b.className='cat';b.type='button';b.appendChild(thumb(k));const s=document.createElement('span');s.textContent=d.name;b.appendChild(s);b.onclick=()=>addAtCenter(k);g.appendChild(b)}
  $('#gGo').onclick=()=>{const k=$('#gT').value,n=clamp(+$('#gN').value||1,1,200),cols=clamp(+$('#gC').value||1,1,30),gap=Math.max(0,+$('#gS').value||0)*100;
    const t=makeItem(k,0,0),b=bounds(t),pw=b.x1-b.x0+gap,ph=b.y1-b.y0+gap,rows=Math.ceil(n/cols);const r=cv.getBoundingClientRect(),c=s2w(r.width/2,r.height/2);
    let num=nextNum();for(let i=0;i<n;i++){const it=makeItem(k,snap(c.x+((i%cols)-(cols-1)/2)*pw),snap(c.y+(Math.floor(i/cols)-(rows-1)/2)*ph));if(k!=='periquera')it.label='Mesa '+(num++);P.items.push(it)}
    commit();toast(n+' mesas colocadas.');if(window.innerWidth<=820)fit()};
}
function nextNum(){let m=0;for(const it of P.items){const r=/(\d+)\s*$/.exec(it.label||'');if(r&&TBL.has(DEFS[it.t].kind))m=Math.max(m,+r[1])}return m+1}
function addAtCenter(k){const r=cv.getBoundingClientRect(),c=s2w(r.width/2,r.height/2);const it=makeItem(k,snap(c.x),snap(c.y));
  if(TBL.has(DEFS[k].kind)&&!DEFS[k].oneSide&&!DEFS[k].cocktail)it.label='Mesa '+nextNum();
  P.items.push(it);commit();select(it.id);if(window.innerWidth<=820)toast(DEFS[k].name+' agregada. Arrástrala a su lugar.')}

/* Editar */
function swatches(path,list,cur,allowNone,noneLbl){const toHex=v=>{const h=list===CHAIRCOL?chairHex(v):colorHex(v);return /^#[0-9a-f]{6}$/i.test(h)?h:'#ffffff'};const custom=cur&&cur[0]==='#';
  return `<div class="sw">${allowNone?`<button type="button" class="none" data-sw="${path}" data-v="" aria-pressed="${!cur}" title="${noneLbl||'Ninguno'}" aria-label="${noneLbl||'Ninguno'}"></button>`:''}${list.map(([n,hx])=>`<button type="button" data-sw="${path}" data-v="${esc(n)}" style="background:${hx}" title="${esc(n)}" aria-label="${esc(n)}" aria-pressed="${cur===n}"></button>`).join('')}<label class="cust" title="Otro color" aria-pressed="${custom}"><input type="color" data-col="${path}" value="${toHex(cur)}" aria-label="Elegir otro color"><span>+</span></label></div><span class="swname">${esc(colorName(cur))}</span>`}
function palChips(cur){return `<div class="sw">${FPAL.map(([n,cs])=>`<button type="button" data-sw="center.palette" data-v="${esc(n)}" style="background:linear-gradient(135deg,${cs.map((c,i)=>`${c} ${Math.round(i*100/cs.length)}% ${Math.round((i+1)*100/cs.length)}%`).join(',')})" title="${esc(n)}" aria-label="${esc(n)}" aria-pressed="${cur===n}"></button>`).join('')}</div><span class="swname">${esc(cur)}</span>`}
function opts(list,cur){return list.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${n}</option>`).join('')}
function num(path,val,step,min,lbl,unit){return `<div class="field"><label>${lbl}${unit?` <span class="muted">(${unit})</span>`:''}</label><input type="number" data-k="${path}" data-unit="${unit||''}" step="${step}" min="${min}" value="${unit==='m'?(val/100).toFixed(2):val}"></div>`}
const openSec=new Set(['mesa']);
function sec(id,title,body){return `<details data-sec="${id}" ${openSec.has(id)?'open':''}><summary>${title}</summary><div class="secb">${body}</div></details>`}
function chairFields(ch){return `<div class="field"><label>Modelo</label><select data-k="chair.type">${opts(CHAIRS,ch.type)}</select></div><div class="field"><label>Color de la silla</label>${swatches('chair.color',CHAIRCOL,ch.color)}</div><div class="field"><label>Cojín</label>${swatches('chair.cushion',LINENS,ch.cushion,true,'Sin cojín')}</div><div class="field"><label>Decoración en la silla</label><select data-k="chair.deco">${opts(CHAIRDECO,ch.deco||'')}</select></div>${ch.deco?`<div class="field"><label>Color de la decoración</label>${swatches('chair.decoColor',LINENS,ch.decoColor)}</div>`:''}`}
function renderEdit(){
  const el=$('#tab-edit');const it=P.items.find(i=>i.id===sel);
  if(!it){el.innerHTML=`<section><h3>Nada seleccionado</h3><p class="note">Toca una mesa o un elemento del plano para cambiar su tamaño, sillas, mantel, camino, montaje de cada lugar, centro de mesa e invitados.</p><p class="note">Atajos en computadora: flechas para mover, R para girar 15°, Ctrl+D para duplicar, Supr para borrar.</p></section>`;return}
  const d=DEFS[it.t],k=d.kind;let h=`<p class="eyebrow">${esc(d.name)}</p>`;
  if(TBL.has(k)&&!d.cocktail)h+=`<div class="field"><label for="ePre">Estilo rápido</label><div class="row"><select id="ePre" style="flex:1">${Object.entries(PRESETS).map(([k2,p])=>`<option value="${k2}">${p.name}</option>`).join('')}</select><button class="btn sm" data-act="preset">Aplicar</button></div><p class="note">Pone de un golpe mantel, sillas, montaje de lugar y centro de mesa. Después ajustas lo que quieras.</p></div>`;

  m+=`<div class="field"><label>Rotación</label><div class="row"><button class="btn sm" data-act="rot-15">−15°</button><input type="number" id="eRot" data-k="r" step="1" value="${Math.round(it.r)}" style="width:80px"><button class="btn sm" data-act="rot15">+15°</button><button class="btn sm" data-act="rot90">+90°</button></div></div>`;
  if(k==='round'){const sizes=d.cocktail?[[60,'Ø0.60 m'],[70,'Ø0.70 m'],[80,'Ø0.80 m']]:[[120,'Ø1.20 m · 6 a 8'],[150,'Ø1.50 m · 8 a 10'],[180,'Ø1.80 m · 10 a 12']];

  else if(k==='rect'||k==='oval')m+=`<div class="two">${num('w',it.w,.05,.5,'Largo','m')}${num('h',it.h,.05,.4,'Ancho','m')}</div>`;

  }

  if(['area','pasillo','postres','regalos','bienvenida','pastel'].includes(it.t))m+=`<div class="field"><label>Color</label>${swatches('color',LINENS,it.color)}</div>`;

  if(TBL.has(k)){

    let cub=`<div class="field"><label>Tela del mantel</label><select data-k="linen.fabric">${opts(FABRICS,L.fabric)}</select></div>`;
    if(bare){cub+=`<div class="field"><label>Material de la mesa</label><select data-k="linen.surface">${opts(SURFACES,L.surface)}</select></div>`;
      if(L.surface==='pintada')cub+=`<div class="field"><label>Color de la mesa</label><div class="row"><input type="color" data-col="linen.surfColor" value="${esc(L.surfColor||'#E9E2D6')}" style="width:64px;height:36px;padding:2px" aria-label="Color de la mesa"><span class="swname">${esc((L.surfColor||'').toUpperCase())}</span></div></div>`}

    cub+=`<hr><div class="field"><label>Sobremantel</label><select data-k="overlay.fabric">${opts(OVERLAYS,it.overlay.fabric)}</select></div>${it.overlay.fabric?`<div class="field"><label>Color del sobremantel</label>${swatches('overlay.color',LINENS,it.overlay.color)}</div>`:''}`;
    cub+=`<hr><div class="field"><label>Camino de mesa</label><select data-k="runner.style">${opts(RUNNERS,it.runner.style)}</select></div>${it.runner.style&&it.runner.style!=='follaje'?`<div class="field"><label>Color del camino</label>${swatches('runner.color',LINENS,it.runner.color)}</div>`:''}`;

  const st=el.scrollTop;el.innerHTML=h;el.scrollTop=st;
  el.querySelectorAll('details').forEach(dt=>dt.addEventListener('toggle',()=>{dt.open?openSec.add(dt.dataset.sec):openSec.delete(dt.dataset.sec)}));
  el.querySelectorAll('[data-k]').forEach(inp=>{
    const discrete=inp.type==='checkbox'||inp.tagName==='SELECT';

  if(inp.type==='checkbox')v=inp.checked;else if(inp.type==='number'||inp.dataset.num){v=parseFloat(inp.value);if(!isFinite(v))return;if(inp.dataset.unit==='m')v=Math.round(v*100)}else v=inp.value;

/* Inventario */
function inventory(){
  const G={};const keys=['Mesas','Sillas','Cojines','Decoración de sillas','Mantelería','Sobremanteles','Caminos de mesa','Platos base','Servilletas','Cubiertos','Cristalería','Centros de mesa','Otros elementos'];keys.forEach(k=>G[k]={});
  let seats=0,assigned=0;const add=(g,k,n)=>{G[g][k]=(G[g][k]||0)+(n??1)};
  const chairAdd=(ch,n,extra)=>{add('Sillas',`${chairName(ch.type)}|${colorName(ch.color)}${extra||''}`,n);if(ch.cushion&&ch.type!=='acapulco')add('Cojines',`Cojín ${colorName(ch.cushion)}|`,n);if(ch.deco)add('Decoración de sillas',`${nm(CHAIRDECO,ch.deco)}|${colorName(ch.decoColor)}`,n)};
  for(const it of P.items){const d=DEFS[it.t],k=d.kind;
    if(TBL.has(k)){const L=it.linen,bare=L.fabric==='ninguno';
      const sz=k==='round'?`Ø${m2(it.w)} m`:k==='square'?`${m2(it.w)} × ${m2(it.w)} m`:k==='serp'?`radio ${m2(it.rad)} m, ${it.ang}°`:`${m2(it.w)} × ${m2(it.h)} m`;
      add('Mesas',`${d.name}${bare?' · '+nm(SURFACES,L.surface).toLowerCase():''}|${sz}`);if(!d.cocktail)seats+=it.seats;assigned+=Math.min(guestList(it).length,it.seats);
      if(it.seats)chairAdd(it.chair,it.seats);
      if(!bare)add('Mantelería',`${nm(FABRICS,L.fabric)} · ${colorName(L.color)}|${linenSize(it)}`);
      if(it.overlay&&it.overlay.fabric&&k!=='serp')add('Sobremanteles',`${nm(OVERLAYS,it.overlay.fabric)} · ${colorName(it.overlay.color)}|${k==='round'||k==='square'?'cuadrado de '+m2(Math.ceil(it.w*.74/5)*5)+' m':'para '+m2(it.w)+' m de largo'}`);
      if(it.runner&&it.runner.style)add('Caminos de mesa',`${nm(RUNNERS,it.runner.style)}${it.runner.style!=='follaje'?' · '+colorName(it.runner.color):''}|${k==='round'||k==='square'?'para mesa de '+m2(it.w)+' m':'de '+m2(it.w+(it.runner.style==='follaje'?0:60))+' m'}`);
      const ps=it.place;if(ps&&ps.on&&!d.cocktail&&it.seats){const n=it.seats;
        if(ps.charger)add('Platos base',`${nm(CHARGERS,ps.charger)}|`,n);
        add('Servilletas',`${colorName(ps.napkin)}|${nm(FOLDS,ps.fold).toLowerCase()}`,n);
        add('Cubiertos',`Juego ${nm(CUTLERY,ps.cutlery).toLowerCase()}|tenedor, cuchillo y cuchara`,n);
        if(ps.glasses)add('Cristalería',`Copa ${nm(GLASS,ps.glass).toLowerCase()}|${ps.glasses} por lugar`,n*ps.glasses)}
      const cnt=centerCount(it,k);if(cnt){const cn=it.center;add('Centros de mesa',`${nm(CENTERS,cn.type)}|${cn.type==='velas'?'':nm(FLOWERS,cn.flower)+' · '+cn.palette+' · '+nm(VASES,cn.vase).toLowerCase()}`,cnt)}}
    else if(k==='chair')chairAdd(it.chair,1);
    else if(k==='ceremony')chairAdd(it.chair,it.rows*it.perSide*2,' · ceremonia');
    else if(it.t!=='texto'){let det=['pista','tarima','area','pasillo','lounge','photobooth','barra','postres','regalos','bienvenida','dj','pantalla'].includes(it.t)?`${m2(it.w)} × ${m2(it.h)} m`:'';if(it.t==='pista')det+=' · '+nm(FINISH,it.finish).toLowerCase();add('Otros elementos',`${d.name}|${det}`)}
  }
  return {groups:keys.map(k=>[k,G[k]]),seats,assigned};
}
function renderInv(){

  $('#iCsv').onclick=exportCsv;

function header(){const e=P.event;return [e.date?new Date(e.date+'T12:00').toLocaleDateString('es-MX',{dateStyle:'long'}):'',e.place,e.guests?e.guests+' invitados':'',e.planner?'Planner: '+e.planner:''].filter(Boolean).join('  ·  ')}
async function exportPng(){const c=await planCanvas($('#exGrid').checked);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!(await saveFile(fname('png'),blob))&&!dl)showPreview(c)}
function showPreview(c){const p=$('#exPrev');p.hidden=false;p.innerHTML='';const im=new Image();im.src=c.toDataURL('image/png');im.style.width='100%';im.alt='Vista del plano';p.appendChild(im);$('#exMsg').textContent='Mantén presionada o haz clic derecho en la imagen para guardarla.'}
async function exportPdf(){
  const msg=$('#exMsg');msg.textContent='Preparando PDF…';
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')}catch(e){msg.textContent='No se pudo cargar el generador de PDF. Revisa tu conexión.';return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:$('#exPaper').value});const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),M=12;
  const title=P.event.couple||P.name;
  doc.setFont('times','normal');doc.setFontSize(20);doc.setTextColor(30,42,36);doc.text(title,M,M+6);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(93,106,98);doc.text(header()||' ',M,M+12);
  doc.setDrawColor(211,219,209);doc.line(M,M+15,PW-M,M+15);
  const c=await planCanvas($('#exGrid').checked);const img=c.toDataURL('image/jpeg',.9);const aw=PW-2*M,ah=PH-M-(M+19);const r=Math.min(aw/c.width,ah/c.height);
  doc.addImage(img,'JPEG',M+(aw-c.width*r)/2,M+19,c.width*r,c.height*r);
  // Inventario
  doc.addPage(undefined,'portrait');let W2=doc.internal.pageSize.getWidth(),H2=doc.internal.pageSize.getHeight(),y=M+6;
  const newPageIf=n=>{if(y+n>H2-M){doc.addPage(undefined,'portrait');y=M+6}};
  doc.setFont('times','normal');doc.setFontSize(18);doc.setTextColor(30,42,36);doc.text('Inventario de montaje',M,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(93,106,98);doc.text(title+(header()?'  ·  '+header():''),M,y,{maxWidth:W2-2*M});y+=8;
  const inv=inventory();doc.setTextColor(30,42,36);doc.setFontSize(10);doc.text(`Lugares en mesas: ${inv.seats}    Invitados: ${P.event.guests||0}    Con lugar asignado: ${inv.assigned}`,M,y);y+=8;
  for(const [t,o] of inv.groups){const rows=Object.entries(o);if(!rows.length)continue;newPageIf(16);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(t,M,y);y+=5;doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    for(const [k,n] of rows){const [a,b]=k.split('|');const lines=doc.splitTextToSize(b||'',W2-2*M-95);newPageIf(lines.length*4.4+2);doc.text(a,M,y);doc.setTextColor(93,106,98);doc.text(lines,M+70,y);doc.setTextColor(30,42,36);doc.text(String(n),W2-M,y,{align:'right'});y+=Math.max(1,lines.length)*4.4+1.6;doc.setDrawColor(230,234,229);doc.line(M,y-3,W2-M,y-3)}y+=4}
  // Mesas
  const ts=P.items.filter(i=>TBL.has(DEFS[i.t].kind)).sort((a,b)=>(a.label||'').localeCompare(b.label||'',undefined,{numeric:true}));
  if(ts.length){newPageIf(20);y+=2;doc.setFont('times','normal');doc.setFontSize(16);doc.text('Distribución de mesas',M,y);y+=7;doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    for(const t of ts){const g=guestList(t);const cov=t.linen.fabric==='ninguno'?'mesa de '+nm(SURFACES,t.linen.surface).toLowerCase():'mantel '+nm(FABRICS,t.linen.fabric).toLowerCase()+' '+colorName(t.linen.color);const head=`${t.label||DEFS[t.t].name}  ·  ${DEFS[t.t].name}  ·  ${t.seats} lugares  ·  ${cov}  ·  silla ${chairName(t.chair.type)} ${colorName(t.chair.color)}`;
      const body=$('#exGuests').checked&&g.length?doc.splitTextToSize(g.join(', '),W2-2*M-4):[];const note=t.note?doc.splitTextToSize('Nota: '+t.note,W2-2*M-4):[];
      newPageIf(6+(body.length+note.length)*4.4);doc.setFont('helvetica','bold');doc.text(head,M,y,{maxWidth:W2-2*M});doc.setFont('helvetica','normal');y+=4.6;
      if(body.length){doc.setTextColor(60,70,64);doc.text(body,M+4,y);y+=body.length*4.4}if(note.length){doc.setTextColor(169,132,63);doc.text(note,M+4,y);y+=note.length*4.4}doc.setTextColor(30,42,36);y+=2.5}}
  const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();doc.setFontSize(8);doc.setTextColor(150,160,154);doc.text(`${i} / ${pages}`,pw-M,ph-6,{align:'right'})}
  const blob=doc.output('blob');const ok=await saveFile(fname('pdf'),blob);msg.textContent=ok?'PDF listo.':''}
function exportCsv(){const inv=inventory();const q=s=>'"'+String(s).replace(/"/g,'""')+'"';let out='Grupo,Concepto,Detalle,Cantidad\n';
  for(const [t,o] of inv.groups)for(const [k,n] of Object.entries(o)){const [a,b]=k.split('|');out+=[q(t),q(a),q(b||''),n].join(',')+'\n'}
  out+='\nMesa,Tipo,Lugares,Invitados asignados,Invitados\n';for(const t of P.items.filter(i=>TBL.has(DEFS[i.t].kind))){const g=guestList(t);out+=[q(t.label||''),q(DEFS[t.t].name),t.seats,g.length,q(g.join('; '))].join(',')+'\n'}
  saveFile(fname('csv'),'﻿'+out)}
$('#exportBtn').onclick=()=>{$('#exportModal').hidden=false;$('#exMsg').textContent=dl===null?'':'';$('#exPrev').hidden=true;$('#exPdf').focus()};
$('#exClose').onclick=()=>{$('#exportModal').hidden=true};
$('#exportModal').addEventListener('click',e=>{if(e.target.id==='exportModal')$('#exportModal').hidden=true});
$('#exPdf').onclick=()=>exportPdf().catch(()=>{$('#exMsg').textContent='No se pudo generar el PDF.'});
$('#exPng').onclick=()=>exportPng().catch(()=>{$('#exMsg').textContent='No se pudo generar la imagen.'});
$('#exCsv').onclick=exportCsv;

let toastT;function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}
function renderAll(){renderAdd();renderEdit();renderVenue();renderInv();dirty=true}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>dirty=true);
new MutationObserver(()=>dirty=true).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts&&document.fonts.ready.then(()=>{dirty=true;renderAdd()});

  if(!p){P=newProject();p=sampleProject()}
  loadProject(p);resize();requestAnimationFrame(frame);setTimeout(fit,60);
})();
})();
